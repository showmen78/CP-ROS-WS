# These are the default CP-X bridge and pipeline values from
# new_opencda/opencda/scenario_testing/config_yaml/cpx_profile_full_default.yaml.
planner:
  enabled: true
  type: cpx_mpc
  mode: full_cpx_mpc
  architecture_profile: unified_full_v2
  fallback_policy: emergency_stop
  safety_supervisor_enabled: true
  safety_max_steer_delta: 0.25
  safety_max_throttle_delta: 0.45
  safety_max_brake_delta: 0.6
  road_boundary_projection_max_heading_step_rad: 0.04
  road_boundary_projection_reset_distance_m: 2.5
  road_boundary_carla_drivable_footprint_enabled: true
  lane_change_target_lane_entry_min_progress: 0.5
  lane_change_stabilization_duration_s: 2.5
  lane_change_stabilization_speed_mps: 1.5
  lane_change_stabilization_timeout_frames: 100
  reference_vehicle_half_width_m: 1.07
  reference_vehicle_half_length_m: 2.45
  turn_swept_footprint_correction_padding_m: 0.05
  carla_reference_boundary_aware: true
  carla_reference_tracking_reserve_m: 0.2
  control_buffer_max_reference_anchor_jump_m: 0.75
  lane_change_completion_footprint_margin_m: 0.05
  publish_cp_message: true
  require_native_opencda_cp: true
  target_speed_mps: 10.0
  lookahead_m: 18.0
  min_front_gap_m: 8.0
  communication_range_m: 80.0
  max_mpc_obstacles: 4
  route_reached_distance_m: 3.0
  tracker_max_stale_s: 0.5
  tracker_max_speed_mps: 45.0
  tracker_max_acceleration_mps2: 12.0
  tracker_max_position_jump_m: 12.0
  mpc_feedback_enabled: true
  mpc_feedback_hold_s: 1.5
  mpc_feedback_min_failures: 1
  mpc_feedback_candidate_weight: 80.0
  control_buffer_enabled: true
  control_buffer_max_reuse_s: 0.35
  opencda_style_reference_conditioning_enabled: false
  lane_follow_speed_recovery_enabled: false
  lane_follow_negative_accel_release_enabled: false
  overspeed_guard_enabled: false
  overspeed_margin_mps: 0.5
  overspeed_min_brake: 0.2
  overspeed_max_brake: 0.65
  low_speed_lateral_recovery_enabled: false
  low_speed_lateral_recovery_speed_mps: 0.8
  low_speed_lateral_recovery_threshold_m: 1.2
  low_speed_lateral_recovery_target_speed_mps: 1.0
  low_speed_lateral_recovery_max_steer_rad: 0.18
  full_lane_change_start_lock_s: 8.0
  full_dense_traffic_lane_change_lock_enabled: false
  full_dense_traffic_object_count: 8
  full_dense_traffic_risky_lane_count: 2
  full_prepare_lane_change_reference_lock: true
  full_allow_opportunistic_lane_change: false
  route_lane_change_preparation_start_distance_m: 45.0
  route_lane_change_latest_start_distance_m: 12.0
  route_lane_change_target_safety_threshold: 0.65
  route_lane_change_require_adjacent: true
  full_lane_follow_max_destination_lateral_m: 1.2
  full_lane_follow_max_reference_first_lateral_m: 0.65
  full_stop_max_destination_lateral_m: 1.0
  full_stop_max_reference_first_lateral_m: 0.55
  full_stop_guard_destination_forward_m: 6.0
  full_mpc_reference_stabilizer_enabled: true
  full_reference_stabilizer_min_forward_m: -0.25
  full_reference_stabilizer_min_spacing_m: 0.35
  full_reference_stabilizer_max_heading_step_rad: 0.75
  full_stop_reference_buffer_m: 1.5
  full_stop_reference_decel_mps2: 2.0
  full_stop_reference_speed_cap_mps: 2.0
  normal_stop_mpc_suspend_speed_mps: 0.3
  normal_stop_mpc_suspend_brake: 0.08
  reference_contract_lane_follow_min_first_forward_m: 0.5
  reference_contract_lane_follow_max_first_lateral_abs_m: 0.75
  reference_contract_lane_follow_max_destination_lane_error_m: 0.75
  reference_contract_lane_follow_max_destination_body_lateral_abs_m: 1.5
  reference_contract_stop_min_first_forward_m: 0.2
  reference_contract_stop_max_first_lateral_abs_m: 0.75
  reference_contract_stop_max_destination_lane_error_m: 0.75
  reference_contract_stop_max_destination_body_lateral_abs_m: 1.5
  opencda_reference_recovery_speed_mps: 1.2
  record_debug: true
  debug_output_dir: opencda/planning_module/opencda_bridge/debug_cpx_default
  debug: true
