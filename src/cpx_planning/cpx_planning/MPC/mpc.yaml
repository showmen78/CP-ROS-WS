mpc:
  horizon_s: 4.5
  adaptive_horizon_enabled: true
  adaptive_horizon_min_s: 1.0
  adaptive_horizon_max_s: 5.0
  plan_dt_s: 0.1
  trajectory_generation_frequency_hz: 4.0
  constraints:
    min_steer_rad: -0.6
    max_steer_rad: 0.6
    min_steer_rate_rps: -0.35
    max_steer_rate_rps: 0.35
    min_velocity_mps: 0.0
    max_velocity_mps: 30.0
  local_goal:
    v_ref_mps: 5.0
    behavior_destination_distance_buffer_m: 0.0
    dynamic_lookahead_enabled: true
    dynamic_lookahead_min_distance_m: 20.0
    temporary_destination_waypoint_gap: 20
    dynamic_lookahead_max_distance_m: 40.0
    dynamic_lookahead_speed_gain: 1
    dynamic_lookahead_curvature_gain: 100.0
    dynamic_lookahead_curvature_sample_spacing_m: 5.0
    lock_to_final_distance_m: 5.0
    final_speed_taper_distance_m: 5.0
    final_reached_threshold_m: 0.5
  obstacle_filter:
    enable_height_filter: true
    tracking_distance_m: 70.0
    max_dynamic_obstacles: 64
    max_planning_obstacles: 64
    vertical_clearance_margin_m: 1.0
    default_obstacle_height_m: 2.0
  visualization:
    show_global_route: true
  final_stop_speed_cap:
    enabled: true
    destination_speed_activation_threshold_mps: 0.05
    stop_buffer_m: 3
  reference_rollout:
    heading_gain: 1.6
    speed_gain: 1.6
    prefer_lane_center_path: true
    path_los_heading_blend: 0.05
    use_previous_solution_seed: true
    consecutive_solver_failure_reset_threshold: 10
    fail_safe_gentle_brake_deceleration_mps2: 2.0
    fail_safe_emergency_stop_failure_threshold: 20
    previous_solution_search_steps: 15
    previous_solution_max_position_error_m: 3.0
    previous_solution_max_heading_error_rad: 0.75
    previous_solution_max_speed_error_mps: 1.0
    sequential_linearization_iterations: 4
    obstacle_aware_speed_enabled: true
    obstacle_check_horizon_s: 4.0
    lead_obstacle_trigger_distance_m: 22.0
    lead_obstacle_lateral_margin_m: 1.2
    lead_obstacle_stop_buffer_m: 8.0
    lead_obstacle_braking_deceleration_mps2: 1.5
  mode_cost_profile_blend_alpha: 0.18
  mode_cost_profiles:
    lane_follow:
      w_attractive: 0.6
      q_x: 0.0
      q_y: 0.0
      q_v: 1.5
      q_psi: 0.0
      lane_center_w0: 40.0
      lane_center_xy_w0: 8.0
      lane_center_q_psi: 2.0
      road_boundary_w: 10000.0
      road_boundary_margin_m: 0.5
      road_boundary_max_slack_m: 0.1
      w_control: 8.0
      q_a: 8.0
      q_delta: 160.0
    tracking:
      w_attractive: 0.35
      q_x: 0.4
      q_y: 0.0
      q_v: 2.5
      q_psi: 0.0
      lane_center_w0: 7.0
      lane_center_xy_w0: 1.0
      lane_center_q_psi: 1.0
      road_boundary_w: 1500.0
      road_boundary_margin_m: 0.45
      road_boundary_max_slack_m: 0.2
      w_control: 18.0
      q_a: 18.0
      q_delta: 260.0
    tracking_stop:
      w_attractive: 0.25
      q_x: 0.3
      q_y: 0.0
      q_v: 4.0
      q_psi: 0.0
      lane_center_w0: 4.0
      lane_center_xy_w0: 0.8
      lane_center_q_psi: 0.8
      road_boundary_w: 1000.0
      road_boundary_margin_m: 0.45
      road_boundary_max_slack_m: 0.25
      w_control: 22.0
      q_a: 24.0
      q_delta: 320.0
    intersection_turn:
      w_attractive: 0.8
      q_x: 1.5
      q_y: 0.0
      q_v: 1.2
      q_psi: 0.0
      lane_center_w0: 36.0
      lane_center_xy_w0: 3.5
      lane_center_q_psi: 3.0
      road_boundary_w: 16000.0
      road_boundary_margin_m: 0.65
      road_boundary_max_slack_m: 0.06
      w_control: 8.0
      q_a: 8.0
      q_delta: 180.0
    stop:
      w_attractive: 1.2
      q_x: 2.0
      q_y: 0.0
      q_v: 6.0
      q_psi: 0.0
      lane_center_w0: 24.0
      lane_center_xy_w0: 1.5
      lane_center_q_psi: 2.5
      road_boundary_w: 12000.0
      road_boundary_margin_m: 0.55
      road_boundary_max_slack_m: 0.08
      w_control: 10.0
      q_a: 12.0
      q_delta: 140.0
    prepare_lane_change:
      w_attractive: 0.9
      q_x: 1.5
      q_y: 0.0
      q_v: 1.8
      q_psi: 0.0
      lane_center_w0: 18.0
      lane_center_xy_w0: 2.0
      lane_center_q_psi: 2.0
      road_boundary_w: 11000.0
      road_boundary_margin_m: 0.55
      road_boundary_max_slack_m: 0.09
      w_control: 7.0
      q_a: 7.0
      q_delta: 130.0
    execute_lane_change:
      w_attractive: 1.1
      q_x: 2.5
      q_y: 0.0
      q_v: 1.6
      q_psi: 0.0
      lane_center_w0: 28.0
      lane_center_xy_w0: 2.0
      lane_center_q_psi: 2.5
      road_boundary_w: 14000.0
      road_boundary_margin_m: 0.6
      road_boundary_max_slack_m: 0.07
      w_control: 8.0
      q_a: 8.0
      q_delta: 160.0
    recovery:
      w_attractive: 0.7
      q_x: 1.0
      q_y: 0.0
      q_v: 0.8
      q_psi: 0.0
      lane_center_w0: 16.0
      lane_center_xy_w0: 2.0
      lane_center_q_psi: 2.0
      road_boundary_w: 10000.0
      road_boundary_margin_m: 0.6
      road_boundary_max_slack_m: 0.1
      w_control: 14.0
      q_a: 14.0
      q_delta: 180.0
  cost:
    attractive:
      w_attractive: 1.0
      q_x: 2
      q_y: 0.0
      q_v: 2.0
      q_psi: 0.0
    lane_center_follow:
      enabled: true
      w0: 20.0
      xy_w0: 3.0
      local_stage_window: 2
      q_psi: 2.0
      use_progress_lookup: false
      xy_term_uses_frenet_decomposition: false
    road_boundary:
      enabled: true
      w_boundary: 10000.0
      margin_m: 0.5
      max_slack_m: 0.1
    road_envelope:
      enabled: true
      w_envelope: 10000.0
      max_slack_m: 0.1
      shape_exponent: 4.0
      rho: -8.0
    speed_soft_constraint:
      enabled: true
      weight: 200.0
      max_slack_mps: 3.0
    control:
      w_control: 5.0
      q_a: 5.0
      q_delta: 100
    repulsive_potential:
      enabled: true
      w_safe_zone: 0.0
      w_collision_zone: 100.0
      safe_exponential_gain: 3.0
      safe_distance_shift: 1.5
      collision_exponential_gain: 10.0
      collision_distance_shift: 1.0
      max_braking_deceleration_mps2: 8.0
      comfort_deceleration_mps2: 2.0
      reaction_time_s: 1.0
      static_longitudinal_buffer_m: 2.0
      static_lateral_buffer_m: 0.5
      shape_exponent: 4.0
      min_lateral_approach_speed_mps: 0.1
      max_longitudinal_zone_length_m: 25.0
      limit_lateral_zone_to_lane_width: true
      max_lateral_zone_lane_fraction: 1
      project_hessian_psd: true
      min_hessian_eig: 1.0e-09
      log_barrier_enabled: true
      log_barrier_replace_exponential: true
      w_log_barrier: 50.0
      log_barrier_gain: 4.0
      cross_track_suppression_enabled: true
      cross_track_full_suppression_m: 1.0
      cross_track_full_response_m: 2.0
  solver:
    max_iter: 10000
    eps_abs: 0.001
    eps_rel: 0.001
    polish: true
